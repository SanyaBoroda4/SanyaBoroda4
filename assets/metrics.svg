<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="Key numbers">
  <defs>
    <linearGradient id="n" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <style>
      .t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .card{animation:up .7s ease-out both}
      .c2{animation-delay:.12s}.c3{animation-delay:.24s}.c4{animation-delay:.36s}
      @keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    </style>
  </defs>
  <g transform="translate(0,0)"><g class="card c1">
    <rect x="1" y="1" width="283" height="148" rx="16" fill="#0d1117" stroke="#30363d"/>
    <text class="t" x="28" y="66" font-size="44" font-weight="700" fill="url(#n)">77 / 87</text>
    <text class="t" x="28" y="98" font-size="15" fill="#e6edf3">blind backtest, payments agent</text>
    <text class="m" x="28" y="124" font-size="12" fill="#7d8590">9 escalated · 1 wrong</text>
  </g></g>
  <g transform="translate(305,0)"><g class="card c2">
    <rect x="1" y="1" width="283" height="148" rx="16" fill="#0d1117" stroke="#30363d"/>
    <text class="t" x="28" y="66" font-size="44" font-weight="700" fill="url(#n)">75 / 82</text>
    <text class="t" x="28" y="98" font-size="15" fill="#e6edf3">RAG golden set, judged correct</text>
    <text class="m" x="28" y="124" font-size="12" fill="#7d8590">recall@10 0.28 → 0.82</text>
  </g></g>
  <g transform="translate(610,0)"><g class="card c3">
    <rect x="1" y="1" width="283" height="148" rx="16" fill="#0d1117" stroke="#30363d"/>
    <text class="t" x="28" y="66" font-size="44" font-weight="700" fill="url(#n)">10×</text>
    <text class="t" x="28" y="98" font-size="15" fill="#e6edf3">faster SQL p95, found by tracing</text>
    <text class="m" x="28" y="124" font-size="12" fill="#7d8590">1.96 s → 0.20 s</text>
  </g></g>
  <g transform="translate(915,0)"><g class="card c4">
    <rect x="1" y="1" width="283" height="148" rx="16" fill="#0d1117" stroke="#30363d"/>
    <text class="t" x="28" y="66" font-size="44" font-weight="700" fill="url(#n)">2,600+</text>
    <text class="t" x="28" y="98" font-size="15" fill="#e6edf3">automated tests, public repos</text>
    <text class="m" x="28" y="124" font-size="12" fill="#7d8590">CI on every push</text>
  </g></g>
</svg>
